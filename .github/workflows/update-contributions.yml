name: Build and deploy website

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update:
    if: github.repository_owner == 'takashiwangbh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/photography-requirements.txt

      - name: Install photography dependencies
        run: python -m pip install -r scripts/photography-requirements.txt

      - name: Build photography collection
        run: python scripts/generate-photography.py

      # Use an account-owned classic PAT with read:user (or user), stored as an
      # Actions secret. The repository-scoped GITHUB_TOKEN cannot substitute for it.
      - name: Generate authenticated contribution graph
        env:
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
        run: node scripts/generate-contributions.mjs

      - name: Prepare the static website
        shell: bash
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'scripts' \
            --exclude '/photograph/' \
            --exclude '_site' \
            --exclude '.DS_Store' \
            --exclude '.gitignore' \
            ./ _site/
          mkdir -p _site/photograph
          cp -R photograph/generated _site/photograph/generated

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
